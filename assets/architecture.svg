<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <!--
    Marshal architecture diagram.
    Flow: Driver Agent → MCP Server → Fleet → N isolated worktrees (each with a backend
    adapter) → results merge back to the driver.
    Colours:
      #FF5714  — marshal orange, used for flow arrows and the fan-out/merge lines
      #6B7280  — neutral grey, used for box strokes, labels, and secondary text
      #F3F4F6  — very light grey fill for boxes
    Font: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif
    Stroke weight: 2 for boxes, 2 for connectors (matches logo's proportional weight at
    this larger canvas).
  -->

  <!-- ── Box styles ── -->
  <!-- Driver Agent -->
  <rect x="20" y="130" width="100" height="60" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="70" y="155" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#374151">Driver</text>
  <text x="70" y="170" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#6B7280">Agent</text>

  <!-- MCP Server -->
  <rect x="170" y="130" width="100" height="60" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#374151">MCP</text>
  <text x="220" y="170" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#6B7280">Server</text>

  <!-- Fleet -->
  <rect x="320" y="130" width="80" height="60" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="360" y="162" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#374151">Fleet</text>

  <!-- Worktree boxes -->
  <rect x="450" y="40"  width="130" height="46" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="515" y="60" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="600" fill="#374151">Worktree A</text>
  <text x="515" y="75" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#6B7280">claude-code</text>

  <rect x="450" y="102" width="130" height="46" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="515" y="122" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="600" fill="#374151">Worktree B</text>
  <text x="515" y="137" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#6B7280">cursor</text>

  <rect x="450" y="172" width="130" height="46" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="515" y="192" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="600" fill="#374151">Worktree C</text>
  <text x="515" y="207" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#6B7280">opencode</text>

  <rect x="450" y="234" width="130" height="46" rx="6"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="515" y="254" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="600" fill="#374151">Worktree D</text>
  <text x="515" y="269" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#6B7280">codex / goose</text>

  <!-- ── Arrows (orange for data flow) ── -->
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#FF5714"/>
    </marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Driver → MCP -->
  <line x1="120" y1="160" x2="166" y2="160"
        stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>

  <!-- MCP → Fleet -->
  <line x1="270" y1="160" x2="316" y2="160"
        stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>

  <!-- Fleet → Worktrees (fan-out in orange) -->
  <path d="M 400 160 L 420 63 L 446 63"
        fill="none" stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>
  <path d="M 400 160 L 420 125 L 446 125"
        fill="none" stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>
  <path d="M 400 160 L 420 195 L 446 195"
        fill="none" stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>
  <path d="M 400 160 L 420 257 L 446 257"
        fill="none" stroke="#FF5714" stroke-width="2" stroke-linecap="round"
        marker-end="url(#arrow-orange)"/>

  <!-- Worktrees → Driver (merge-back, grey dashed to show it returns) -->
  <path d="M 450 63 L 440 63 L 440 290 L 70 290 L 70 194"
        fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="5,4"
        marker-end="url(#arrow-grey)"/>

  <!-- Merge label -->
  <text x="255" y="305"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#6B7280" text-anchor="middle">integrate (collect → review → merge)</text>
</svg>
