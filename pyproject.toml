[project]
name = "marshal-agents"
version = "0.4.0"
description = "Orchestration engine for driving a fleet of headless coding agents (Cursor, OpenCode, Codex, Antigravity, Claude Code) from one driver via MCP + Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "chiruu12" }]
keywords = [
    "agents",
    "orchestration",
    "mcp",
    "cursor",
    "opencode",
    "codex",
    "antigravity",
    "claude-code",
    "headless",
    "coding-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: POSIX",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
]

# Distribution name is `marshal` when that name is free on PyPI; fallback is
# `marshal-orchestrator`. The IMPORT package is always `marshal_engine` — a
# top-level package literally named `marshal` would shadow the stdlib builtin.

[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]
dev = [
    "pytest>=8",
    "ruff>=0.15.20",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "pytest-cov>=5",
]

[project.scripts]
marshal = "marshal_engine.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/chiruu12/marshal"
Repository = "https://github.com/chiruu12/marshal"
Issues = "https://github.com/chiruu12/marshal/issues"
Changelog = "https://github.com/chiruu12/marshal/blob/main/CHANGELOG.md"

[build-system]
# Pinned: the build backend is resolved at build time, NOT from uv.lock (which tracks runtime deps),
# so an unconstrained backend makes the published artifact non-reproducible.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Wheel ships only the import package (incl. py.typed).
packages = ["src/marshal_engine"]

[tool.hatch.build.targets.sdist]
# Rebuild needs src/, tests/, lockfile, and project metadata. Keep local IDE /
# runtime paths out of the tarball (they are gitignored or not part of the package).
exclude = [
    "/.cursor",
    "/.marshal",
    "/teams",
    "/marshal-runs",
    "/dist",
    "/build",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated explicitly rather than inherited. Ruff's DEFAULT rule set is not a stable contract - 0.16
# widened it, and a routine lockfile bump turned the commit gate red with ~280 findings across 20
# rules that no one had chosen. Pinning the set means a ruff upgrade changes ruff, and adopting a
# new rule is its own reviewed commit. These four are the set the codebase was in fact linted
# against; broadening it is tracked separately.
select = [
    "E4", "E7", "E9", "F",
    # Adopted deliberately (#239), one family at a time rather than by inheriting a default.
    # PLW1510: `subprocess.run` without an explicit `check=`. This codebase shells out constantly
    # and every call site here already inspects `returncode`; stating it stops the next one from
    # relying on a default that differs from what the surrounding code does.
    "PLW1510",
    # RUF012: a mutable class attribute needs `ClassVar`. Every hit here was a deliberate
    # class-level table (permission maps, a process-shared registry), so the annotation states
    # intent that was previously only implied - and keeps the next one from being an accidental
    # shared default (#239).
    "RUF012",
    # UP017: `datetime.timezone.utc` -> `datetime.UTC`. Adopted because it is a pure alias on the
    # 3.11 floor this project already targets, so the rewrite cannot change behaviour - it only
    # settles which spelling the codebase uses, which was previously split between the two (#239).
    "UP017",
    # UP035/UP037: deprecated typing imports, and annotations quoted for a forward reference that
    # `from __future__ import annotations` already makes unnecessary. Both are mechanical and
    # autofixable, and neither changes what the code does (#239).
    "UP035", "UP037",
    # Two pyupgrade rules are deliberately NOT adopted, recorded here so they are not re-litigated:
    #   UP042 (`class X(str, Enum)` -> `StrEnum`) changes behaviour. `str()` of a `str, Enum` member
    #     gives `X.a`; of a `StrEnum` member it gives `a`. These enums are serialized to the ledger,
    #     the MCP surface, and persisted run records, so that is a wire-format change wearing a
    #     lint's clothing - it needs its own PR with migration thought, not a sweep.
    #   UP031 (`%`-format) fires on three code-generation strings that use `%r` precisely because
    #     they need repr-quoting of a path into a generated script. The rewrite is ruff-unsafe and
    #     buys nothing.
    # I001: import-block sorting. Pure formatting - adopted because unsorted imports are a standing
    # source of diff noise, where two PRs touching neighbouring imports collide over ordering rather
    # than content. Destroys no information, unlike RUF100 (see #239).
    "I001",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Only ever collect the real suite. Live agent runs drop git worktrees (full repo copies,
# tests included) under marshal-runs/ and .marshal/; without this, pytest discovers those
# duplicate test modules and collection explodes.
testpaths = ["tests"]
norecursedirs = ["marshal-runs", ".marshal", ".venv", "tmp", "build", "dist"]

# Coverage is opt-in via a flag (CI passes --cov) so a bare local `pytest -q` stays fast; this
# block just configures what gets measured and how it's reported when the flag is on.
[tool.coverage.run]
source = ["src/marshal_engine"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
# The whole package is measured; the floor is enforced in CI via --cov-fail-under (see ci.yml).
precision = 0

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
